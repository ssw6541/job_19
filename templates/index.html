<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>잡픽 | 채용공고 검색</title>
    <style>
      :root {
        --navy: #172b4d;
        --green: #10b981;
        --ink: #0f172a;
        --muted: #6d7788;
        --line: #e7ebf2;
        --bg: #f8fafc;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: var(--bg);
      }
      a {
        text-decoration: none;
        color: inherit;
      }
      .topbar {
        background: var(--navy);
        color: #fff;
      }
      .nav {
        max-width: 1180px;
        height: 72px;
        margin: auto;
        padding: 0 24px;
        display: flex;
        align-items: center;
        gap: 34px;
      }
      .logo {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .logo span {
        color: #61a0ff;
      }
      .nav-links {
        display: flex;
        gap: 24px;
        color: #cbd7e9;
        font-size: 14px;
      }
      .nav-links a:first-child {
        color: #fff;
        font-weight: 700;
      }
      .hero {
        background: linear-gradient(120deg, #edf5ff, #fff 72%);
        padding: 76px 24px 92px;
        text-align: center;
      }
      .eyebrow {
        color: var(--blue);
        font-size: 14px;
        font-weight: 700;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0;
        font-size: 42px;
        letter-spacing: -2px;
      }
      .hero p {
        color: var(--muted);
        margin: 17px 0 30px;
      }
      .search-box {
        max-width: 760px;
        margin: auto;
        padding: 7px;
        display: flex;
        background: #fff;
        border: 1px solid #dce4f1;
        border-radius: 12px;
        box-shadow: 0 12px 30px #2b5fa51c;
      }
      .search-box input {
        min-width: 0;
        flex: 1;
        padding: 15px 18px;
        border: 0;
        outline: 0;
        font-size: 16px;
      }
      .search-box button {
        border: 0;
        border-radius: 8px;
        padding: 0 29px;
        background: var(--blue);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }
      .quick {
        max-width: 760px;
        margin: 18px auto 0;
        text-align: left;
        color: var(--muted);
        font-size: 13px;
      }
      .quick a {
        margin-left: 12px;
        color: #536175;
      }
      .content {
        max-width: 1180px;
        margin: -28px auto 0;
        padding: 0 24px 60px;
      }
      .benefits {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .benefit {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 23px;
      }
      .icon {
        display: grid;
        place-items: center;
        width: 38px;
        height: 38px;
        margin-bottom: 15px;
        border-radius: 10px;
        background: #edf5ff;
        color: var(--blue);
        font-weight: 800;
      }
      .benefit h2 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      .benefit p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }
      @media (max-width: 650px) {
        .nav {
          height: 60px;
        }
        .nav-links {
          display: none;
        }
        h1 {
          font-size: 31px;
        }
        .hero {
          padding: 55px 20px 75px;
        }
        .search-box button {
          padding: 0 16px;
        }
        .benefits {
          grid-template-columns: 1fr;
        }
        .content {
          padding: 0 16px 40px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <nav class="nav">
        <a class="logo" href="/"
          >잡
          <span>픽</span>
        </a>
        <div class="nav-links">
          <a href="/">채용공고</a>
          <a href="#">직무 탐색</a>
          <a href="#">커리어 가이드</a>
        </div>
      </nav>
    </header>
    <main>
      <section class="hero">
        <div class="eyebrow">CAREER STARTS HERE</div>
        <h1>내일을 바꾸는 일자리 검색</h1>
        <p>원하는 직무와 지역을 입력하고, 새로운 커리어를 시작해보세요.</p>
        <form class="search-box" action="/search" method="get">
          <input
            type="text"
            name="keyword"
            placeholder="직무, 회사명, 키워드를 검색해보세요"
          />
          <button type="submit">검색하기</button>
        </form>
        <div class="quick">
          인기 검색어 <a href="/search?keyword=개발자">개발자</a>
          <a href="/search?keyword=마케팅">마케팅</a>
          <a href="/search?keyword=디자이너">디자이너</a>
          <a href="/search?keyword=신입">신입</a>
        </div>
      </section>
      <section class="content">
        <div class="benefits">
          <article class="benefit">
            <div class="icon">01</div>
            <h2>빠르게 찾는 맞춤 공고</h2>
            <p>
              관심 키워드만 입력하면 내게 맞는 채용공고를 한눈에 확인할 수
              있어요.
            </p>
          </article>
          <article class="benefit">
            <div class="icon">02</div>
            <h2>다양한 기업 정보</h2>
            <p>관심 기업의 채용 소식을 모아보고 더 나은 선택을 준비하세요.</p>
          </article>
          <article class="benefit">
            <div class="icon">03</div>
            <h2>새로운 기회 발견</h2>
            <p>평소 몰랐던 직무와 기업을 만나 커리어의 가능성을 넓혀보세요.</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
